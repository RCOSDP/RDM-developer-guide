[pytest]
# Acceptance suite (SPEC-04). Run through `grdm-dev accept`, which supplies --base-url, --junitxml,
# --screenshot/--tracing and the output directory.
testpaths = .
python_files = test_*.py
markers =
    core: M2 core scenario (C1-C7), must pass in every profile
    subsystem: M3 subsystem scenario (S1-S5)
    scenario(id, name): scenario id and human name, copied into results.json
    case(kind): "success" or "rejection"
addopts = -ra --strict-markers
