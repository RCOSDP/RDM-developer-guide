# Gitleaks configuration for RDM-developer-guide (gitleaks v8.21.2 format)
#
# The default detection rules shipped with gitleaks are enabled through
# [extend] useDefault = true. Without that table a config file with only an
# allowlist has ZERO rules (review finding R2 on PR #19).
#
# Every allowlist entry below is anchored to one whole line and names the field
# it exempts, so a secret can never hide behind it. In v8.21.2 the global
# [allowlist] combines `paths` and `regexes` with OR (there is no per-regex
# path scoping), which is why no `paths` entry is used here: a path entry
# would exempt whole files. Allowlist regexes are tested against the full
# source line (regexTarget = "line"), not only the matched secret, so the
# field name is part of the match.
#
# Private-repository URL policy (SPEC-01 rule 5, SPEC-06 §5) is NOT a gitleaks
# concern; it is enforced by `python3 tools/manifest_check.py --policy-only`
# in .github/workflows/security.yml.

title = "RDM-developer-guide Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Manifest commit SHAs and image digests (SPEC-01 §3). Each regex is anchored to a complete line whose only payload is that field."
regexTarget = "line"
regexes = [
    # Google's documented public reCAPTCHA v2 TEST site key (always passes verification; not a credential).
    # It sits in the history of docs/guides/storage-addon/README.legacy.md (ported from PR #18); the working
    # tree uses the placeholder <recaptcha-site-key>. Source: https://developers.google.com/recaptcha/docs/faq
    '''6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI''',
    # manifest/upstreams.json: "sha": "<40 lowercase hex>"
    '''^\s*"sha": "[0-9a-f]{40}",?$''',
    # manifest/upstreams.json: "base_image_digest": "sha256:<64 hex>"
    '''^\s*"base_image_digest": "sha256:[0-9a-f]{64}",?$''',
    # manifest/upstreams.toon: one upstreams[] row
    #   repo,branch,kind,tracking_branch,status,sha,fetched_at
    '''^\s*[A-Za-z0-9_./-]+,[A-Za-z0-9_./-]+,(public|private|cos),upstream/[A-Za-z0-9_.-]+,(merged|reference|candidate),[0-9a-f]{40},20[0-9]{2}-[0-9]{2}-[0-9]{2}$''',
    # Legacy waterbutler sample (docs/guides/storage-addon/waterbutler/config/setup.py,
    # its generated site/ copy, and the pre-move path StorageAddon/... in history):
    # a setuptools entry_points line that the default `dropbox-api-token` rule
    # mistakes for a token. The whole line is a Python module path, no secret.
    '''^\s*'dropbox = waterbutler\.providers\.dropbox:DropboxProvider',$''',
]
