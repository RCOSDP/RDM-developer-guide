name: Unit Tests

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  unittest:
    name: Unit tests (installer, tools)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer unit tests (SPEC-02 §10; no Docker required)
        run: PYTHONPATH=installer python3 -m unittest discover -s installer/tests
      - name: Tools unit tests (manifest_check, docs_check)
        run: python3 -m unittest discover -s tools/tests
      - name: Package builds and exposes the console script
        run: |
          python3 -m venv .venv-ci && .venv-ci/bin/pip install -q ./installer
          .venv-ci/bin/grdm-dev --version
