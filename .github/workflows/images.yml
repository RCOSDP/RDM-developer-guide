name: Image recipes

# ADR-07 §4 / SPEC-02 §10: every `image_build` recipe under installer/images/ must build for both
# linux/amd64 and linux/arm64 on every pull request that can change it, so a broken download, digest
# or architecture-specific step is caught before a developer hits it. Nothing is pushed.

on:
  pull_request:
    paths:
      - "installer/images/**"
      - "manifest/upstreams.json"
      - ".github/workflows/images.yml"
      - ".github/scripts/smoke-elasticsearch8.sh"
  push:
    branches: [develop]
    paths:
      - "installer/images/**"
      - "manifest/upstreams.json"

permissions:
  contents: read

jobs:
  recipes:
    name: Build image_build recipes (amd64 + arm64, no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU (arm64 emulation on the amd64 runner)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build every recipe the manifest declares, for both platforms
        run: |
          set -eu
          python3 - <<'PY' > recipes.txt
          import json
          for c in json.load(open("manifest/upstreams.json"))["components"]:
              ib = c.get("image_build")
              if ib:
                  print(f"{c['id'].lower()} {ib['context']} {ib['tag']}")
          PY
          test -s recipes.txt || { echo "no image_build component in the manifest"; exit 0; }
          while read -r cid ctx tag; do
            echo "== $cid ($ctx) tag $tag"
            docker buildx build --platform linux/amd64,linux/arm64 \
              --label "org.gakunin-rdm.component=$cid" \
              -t "grdm-dev/$cid:$tag" --output type=cacheonly "$ctx"
          done < recipes.txt
      - name: Smoke-test the amd64 variant of each recipe (image starts, port opens)
        run: |
          set -eu
          while read -r cid ctx tag; do
            docker buildx build --platform linux/amd64 --load -t "grdm-dev/$cid:$tag" "$ctx"
            docker image inspect "grdm-dev/$cid:$tag" --format '{{index .Config.Labels "org.opencontainers.image.base.digest"}}' | grep -q sha256: || { echo "missing base digest label"; exit 1; }
            case "$cid" in
              elasticsearch8)
                # TLS + authentication (ADR-14): anonymous 401, certificate checked against /es-ca, cluster health,
                # node and plugins; prints the container log on failure and always removes the container and volumes
                bash .github/scripts/smoke-elasticsearch8.sh "grdm-dev/$cid:$tag" ;;
            esac
          done < recipes.txt
